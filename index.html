<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="困りごとから、使える可能性のある福祉・医療・社会保障の制度を探せる情報ガイド。日本語・英語対応。">
<title>困りごと制度ガイド</title>
<meta name="theme-color" content="#2fa864">
<meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://seido-guide-web.vercel.app/icons/fc-card-3x2.png","button":{"title":"🍀 ひらく / Open","action":{"type":"launch_miniapp","name":"Japan Support Guide","url":"https://seido-guide-web.vercel.app/","splashImageUrl":"https://seido-guide-web.vercel.app/icons/icon-512.png","splashBackgroundColor":"#f3faf6"}}}'>
<!-- 旧クライアント/バリデータ互換の fc:frame 併記(中身同一) -->
<meta name="fc:frame" content='{"version":"1","imageUrl":"https://seido-guide-web.vercel.app/icons/fc-card-3x2.png","button":{"title":"🍀 ひらく / Open","action":{"type":"launch_frame","name":"Japan Support Guide","url":"https://seido-guide-web.vercel.app/","splashImageUrl":"https://seido-guide-web.vercel.app/icons/icon-512.png","splashBackgroundColor":"#f3faf6"}}}'>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-title">
      <h1 id="app-title">困りごと制度ガイド</h1>
      <p class="header-sub" id="app-sub">困りごとから、公的な制度をさがす</p>
    </div>
    <button id="btn-set" class="btn-gear" type="button" aria-haspopup="dialog">
      <span class="gear-icon" aria-hidden="true">⚙️</span>
      <span class="gear-label" id="set-label">せってい</span>
    </button>
    <button id="btn-exit" class="btn-exit" type="button" aria-label="このページを閉じる">× とじる</button>
  </div>
</header>

<main id="main">
  <!-- ホーム: 困りごと選択 -->
  <section id="view-home" class="view">
    <div class="search-row">
      <input id="search-input" type="search" placeholder="" aria-label="">
      <button id="btn-search" type="button" class="btn-primary">さがす</button>
    </div>
    <h2 class="section-label" id="home-pick">こまりごとから えらぶ</h2>
    <div id="cat-grid" class="cat-grid"></div>
    <div class="home-note"><p id="home-note-text"></p></div>
  </section>

  <!-- 一覧: 制度リスト -->
  <section id="view-list" class="view" hidden>
    <button class="btn-back" type="button" data-back>← もどる</button>
    <h2 id="list-title" class="list-title"></h2>
    <p id="list-sub" class="list-sub"></p>
    <div id="seido-list" class="seido-list"></div>
  </section>

  <!-- 詳細: 制度の中身 -->
  <section id="view-detail" class="view" hidden>
    <button class="btn-back" type="button" data-back>← もどる</button>
    <article id="detail-body"></article>
  </section>
</main>

<footer class="app-footer">
  <p id="footer-updated"></p>
  <p id="footer-disclaimer"></p>
  <p><span id="footer-credit">介護と支援の相談どころ「そよぎ」</span> <a href="https://soudansoyogi.com/" target="_blank" rel="noopener">soudansoyogi.com</a> ・ <a href="privacy.html" id="footer-privacy">プライバシーポリシー / Privacy</a></p>
  <p id="footer-ver"></p>
</footer>

<!-- せってい -->
<div id="set-overlay" class="set-overlay" hidden>
  <div class="set-panel" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <h2 id="set-title">せってい</h2>
    <div class="set-group">
      <p class="set-group-label">ことば / Language</p>
      <select id="set-lang" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="set-group">
      <p class="set-group-label" id="set-fs-label">もじの大きさ</p>
      <div class="set-fs-row">
        <button type="button" class="set-fs-btn" data-fs="0" id="set-fs-0">ふつう</button>
        <button type="button" class="set-fs-btn" data-fs="1" id="set-fs-1">おおきい</button>
        <button type="button" class="set-fs-btn" data-fs="2" id="set-fs-2">とくだい</button>
      </div>
    </div>
    <button type="button" class="btn-primary set-close" id="set-close">とじる</button>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
