<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="困りごとから、使える可能性のある福祉・医療・社会保障の制度を探せる情報ガイド。日本語・英語対応。">
<title>困りごと制度ガイド</title>
<meta name="theme-color" content="#1e7a47">
<meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://seido-guide-web.vercel.app/icons/fc-card-3x2.png","button":{"title":"🍀 ひらく / Open","action":{"type":"launch_miniapp","name":"Japan Support Guide","url":"https://seido-guide-web.vercel.app/","splashImageUrl":"https://seido-guide-web.vercel.app/icons/icon-512.png","splashBackgroundColor":"#f3faf6"}}}'>
<!-- 旧クライアント/バリデータ互換の fc:frame 併記(中身同一) -->
<meta name="fc:frame" content='{"version":"1","imageUrl":"https://seido-guide-web.vercel.app/icons/fc-card-3x2.png","button":{"title":"🍀 ひらく / Open","action":{"type":"launch_frame","name":"Japan Support Guide","url":"https://seido-guide-web.vercel.app/","splashImageUrl":"https://seido-guide-web.vercel.app/icons/icon-512.png","splashBackgroundColor":"#f3faf6"}}}'>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- 🔴 ?v= は旧Service Workerのcache-firstを外すための版クエリ。js/app.js の ASSET_V と sw.js の ASSETS と必ず揃える -->
<link rel="stylesheet" href="css/style.css?v=1.14">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-title">
      <h1 id="app-title">困りごと制度ガイド</h1>
      <p class="header-sub" id="app-sub">困りごとから、公的な制度をさがす</p>
    </div>
    <button id="btn-exit" class="btn-exit" type="button" aria-label="このページを閉じる">× とじる</button>
  </div>
  <div class="header-tools">
    <div class="tool-group">
      <span class="tool-icon" aria-hidden="true">🌐</span>
      <select id="set-lang" class="tool-select" aria-label="ことば / Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="tool-group" role="group" id="tool-fs">
      <span class="tool-label" id="set-fs-label">もじ</span>
      <button type="button" class="tool-btn set-fs-btn fs-0" data-fs="0" id="set-fs-0">あ</button>
      <button type="button" class="tool-btn set-fs-btn fs-1" data-fs="1" id="set-fs-1">あ</button>
      <button type="button" class="tool-btn set-fs-btn fs-2" data-fs="2" id="set-fs-2">あ</button>
    </div>
    <button type="button" class="tool-btn tool-bgm" id="btn-bgm" aria-pressed="true">
      <span aria-hidden="true">♪</span> <span id="bgm-label">おと あり</span>
    </button>
  </div>
</header>

<main id="main">
  <!-- ホーム: 困りごと選択 -->
  <section id="view-home" class="view">
    <!-- 🔴 Play「誤解を与える表現(政府関連の情報)」: 非提携の免責と、公式の情報源へのリンクを最初の画面に見える形で置く -->
    <div class="home-src">
      <p id="home-src-text"></p>
      <a href="#src" id="home-src-link" class="src-link"></a>
    </div>
    <div class="search-row">
      <input id="search-input" type="search" placeholder="" aria-label="">
      <button id="btn-search" type="button" class="btn-primary">さがす</button>
    </div>
    <h2 class="section-label" id="home-pick">こまりごとから えらぶ</h2>
    <div id="cat-grid" class="cat-grid"></div>
    <div class="home-note"><p id="home-note-text"></p></div>
  </section>

  <!-- 一覧: 制度リスト -->
  <section id="view-list" class="view" hidden>
    <button class="btn-back" type="button" data-back>← もどる</button>
    <h2 id="list-title" class="list-title"></h2>
    <p id="list-sub" class="list-sub"></p>
    <p class="list-src"><a href="#src" id="list-src-link" class="src-link"></a></p>
    <div id="seido-list" class="seido-list"></div>
  </section>

  <!-- 出典の一覧: 公式の情報源 -->
  <section id="view-src" class="view" hidden>
    <button class="btn-back" type="button" data-back>← もどる</button>
    <div id="src-body" class="src-body"></div>
  </section>

  <!-- 詳細: 制度の中身 -->
  <section id="view-detail" class="view" hidden>
    <button class="btn-back" type="button" data-back>← もどる</button>
    <article id="detail-body"></article>
  </section>
</main>

<footer class="app-footer">
  <p id="footer-updated"></p>
  <p id="footer-disclaimer"></p>
  <p><a href="#src" id="footer-src">出典の一覧(公式サイト)</a></p>
  <p><button type="button" id="footer-guide" class="footer-guide">つかいかたを もう一度 見る</button></p>
  <p><span id="footer-credit">介護と支援の相談どころ「そよぎ」</span> <a href="https://soudansoyogi.com/" target="_blank" rel="noopener">soudansoyogi.com</a> ・ <a href="privacy.html" id="footer-privacy">プライバシーポリシー / Privacy</a></p>
  <p id="footer-ver"></p>
</footer>

<script src="js/audio.js?v=1.14"></script>
<script src="js/i18n.js?v=1.14"></script>
<script src="js/data.js?v=1.14"></script>
<script src="js/app.js?v=1.14"></script>
</body>
</html>
